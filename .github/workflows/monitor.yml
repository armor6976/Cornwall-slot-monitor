name: Cornwall Slot Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore previous availability state
        uses: actions/cache/restore@v4
        with:
          path: .monitor-state
          key: cornwall-state-${{ github.run_id }}
          restore-keys: |
            cornwall-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Check Waitwhile availability
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          from playwright.sync_api import sync_playwright

          URL = "https://waitwhile.com/locations/cornwallsamplestore/time"
          WEBHOOK = os.environ["DISCORD_WEBHOOK_URL"]

          STATE_DIR = Path(".monitor-state")
          STATE_FILE = STATE_DIR / "state.json"
          STATE_DIR.mkdir(exist_ok=True)

          print("Opening Waitwhile...")

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)

              page = browser.new_page(
                  viewport={"width": 390, "height": 844}
              )

              page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              try:
                  page.wait_for_selector(
                      "text=Select date and time",
                      timeout=20000
                  )
              except Exception:
                  print("Booking heading not detected; continuing.")

              page.wait_for_timeout(5000)

              body_text = page.locator("body").inner_text()
              browser.close()

          if "Select date and time" in body_text:
              booking_text = body_text.split(
                  "Select date and time",
                  1
              )[1]
          else:
              booking_text = body_text

          # Normalize whitespace so Waitwhile's mobile date buttons
          # don't appear as Mon\n\n28\n\nSep.
          clean_text = re.sub(r"\s+", " ", booking_text)

          short_date_pattern = (
              r"\b(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s+"
              r"\d{1,2}\s+"
              r"(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b"
          )

          long_date_pattern = (
              r"\b(?:Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)"
              r",?\s+"
              r"(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)"
              r"\s+\d{1,2}\b"
          )

          time_pattern = (
              r"\b(?:1[0-2]|[1-9]):[0-5][0-9]\s*"
              r"(?:AM|PM|am|pm)\b"
          )

          dates = sorted(
              set(
                  re.findall(short_date_pattern, clean_text)
                  + re.findall(long_date_pattern, clean_text)
              )
          )

          times = sorted(
              set(
                  x.upper()
                  for x in re.findall(time_pattern, clean_text)
              )
          )

          current = {
              "dates": dates,
              "times": times
          }

          print("Current dates:", dates)
          print("Current times:", times)

          if not STATE_FILE.exists():
              STATE_FILE.write_text(
                  json.dumps(current, indent=2)
              )

              print("Initial baseline saved.")
              raise SystemExit(0)

          try:
              previous = json.loads(
                  STATE_FILE.read_text()
              )
          except Exception:
              previous = {
                  "dates": [],
                  "times": []
              }

          previous_dates = set(previous.get("dates", []))
          previous_times = set(previous.get("times", []))

          current_dates = set(dates)
          current_times = set(times)

          new_dates = sorted(
              current_dates - previous_dates
          )

          new_times = sorted(
              current_times - previous_times
          )

          print("Previous dates:", sorted(previous_dates))
          print("Previous times:", sorted(previous_times))
          print("New dates:", new_dates)
          print("New times:", new_times)

          if new_dates or new_times:
              message_parts = [
                  "🚨 **CORNWALL SAMPLE STORE AVAILABILITY DETECTED**"
              ]

              if new_dates:
                  message_parts.append(
                      "📅 New date(s): " + ", ".join(new_dates)
                  )

              if new_times:
                  message_parts.append(
                      "⏰ New time(s): " + ", ".join(new_times)
                  )

              message_parts.append(
                  "\nBOOK NOW:\n" + URL
              )

              message = "\n".join(message_parts)

              payload = json.dumps({
                  "content": message
              })

              print("Availability detected. Sending Discord alert...")

              result = subprocess.run(
                  [
                      "curl",
                      "--fail-with-body",
                      "--silent",
                      "--show-error",
                      "--retry", "2",
                      "--retry-delay", "2",
                      "-H", "Content-Type: application/json",
                      "-H", "User-Agent: Mozilla/5.0",
                      "-d", payload,
                      WEBHOOK
                  ],
                  capture_output=True,
                  text=True
              )

              if result.returncode != 0:
                  print("Discord alert FAILED.")
                  print("curl stderr:", result.stderr)
                  print("curl stdout:", result.stdout)

                  # Do NOT save the new state if the alert failed.
                  # This ensures the next check tries to notify again.
                  raise SystemExit(1)

              print("✅ Discord alert sent successfully.")

          else:
              print("No new availability detected.")

          # Only update state after either:
          # 1) no change, or
          # 2) the Discord alert was successfully sent.
          STATE_FILE.write_text(
              json.dumps(current, indent=2)
          )

          print("Latest state saved.")
          PY

      - name: Save latest availability state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .monitor-state
          key: cornwall-state-${{ github.run_id }}
