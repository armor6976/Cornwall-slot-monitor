name: Cornwall Slot Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore previous availability state
        uses: actions/cache/restore@v4
        with:
          path: .monitor-state
          key: cornwall-state-${{ github.run_id }}
          restore-keys: |
            cornwall-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Check Waitwhile availability
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from pathlib import Path

          from playwright.sync_api import sync_playwright

          URL = "https://waitwhile.com/locations/cornwallsamplestore/time"
          WEBHOOK = os.environ["DISCORD_WEBHOOK_URL"]

          STATE_DIR = Path(".monitor-state")
          STATE_FILE = STATE_DIR / "state.json"
          STATE_DIR.mkdir(exist_ok=True)

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)

              page = browser.new_page(
                  viewport={
                      "width": 390,
                      "height": 844
                  }
              )

              print("Opening Waitwhile...")

              page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              try:
                  page.wait_for_selector(
                      "text=Select date and time",
                      timeout=20000
                  )
              except Exception:
                  print(
                      "Booking heading was not detected, "
                      "but continuing with page contents."
                  )

              page.wait_for_timeout(5000)

              body_text = page.locator("body").inner_text()

              browser.close()

          if "Select date and time" in body_text:
              booking_text = body_text.split(
                  "Select date and time",
                  1
              )[1]
          else:
              booking_text = body_text

          short_date_pattern = (
              r"\b(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s+"
              r"\d{1,2}\s+"
              r"(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b"
          )

          long_date_pattern = (
              r"\b(?:Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)"
              r",?\s+"
              r"(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)"
              r"\s+\d{1,2}\b"
          )

          time_pattern = (
              r"\b(?:1[0-2]|[1-9]):[0-5][0-9]\s*"
              r"(?:AM|PM|am|pm)\b"
          )

          dates = sorted(
              set(
                  re.findall(
                      short_date_pattern,
                      booking_text
                  )
                  +
                  re.findall(
                      long_date_pattern,
                      booking_text
                  )
              )
          )

          times = sorted(
              set(
                  match.upper()
                  for match in re.findall(
                      time_pattern,
                      booking_text
                  )
              )
          )

          current = {
              "dates": dates,
              "times": times
          }

          print("Current dates:", dates)
          print("Current times:", times)

          if not STATE_FILE.exists():
              STATE_FILE.write_text(
                  json.dumps(
                      current,
                      indent=2
                  )
              )

              print("Initial baseline saved.")
              raise SystemExit(0)

          try:
              previous = json.loads(
                  STATE_FILE.read_text()
              )
          except Exception:
              previous = {
                  "dates": [],
                  "times": []
              }

          previous_dates = set(
              previous.get("dates", [])
          )

          previous_times = set(
              previous.get("times", [])
          )

          current_dates = set(dates)
          current_times = set(times)

          new_dates = sorted(
              current_dates - previous_dates
          )

          new_times = sorted(
              current_times - previous_times
          )

          if new_dates or new_times:
              message_parts = [
                  "🚨 **CORNWALL SAMPLE STORE AVAILABILITY DETECTED**"
              ]

              if new_dates:
                  message_parts.append(
                      "📅 New date(s): "
                      + ", ".join(new_dates)
                  )

              if new_times:
                  message_parts.append(
                      "⏰ New time(s): "
                      + ", ".join(new_times)
                  )

              message_parts.append(
                  "\nBOOK NOW:\n" + URL
              )

              message = "\n".join(
                  message_parts
              )

              payload = json.dumps({
                  "content": message
              }).encode("utf-8")

              request = urllib.request.Request(
                  WEBHOOK,
                  data=payload,
                  headers={
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

              urllib.request.urlopen(
                  request,
                  timeout=30
              )

              print("🚨 NEW AVAILABILITY FOUND")
              print("New dates:", new_dates)
              print("New times:", new_times)
              print("Discord notification sent.")

          else:
              print(
                  "No new availability detected."
              )

          STATE_FILE.write_text(
              json.dumps(
                  current,
                  indent=2
              )
          )

          print("Latest state saved.")
          PY

      - name: Save latest availability state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .monitor-state
          key: cornwall-state-${{ github.run_id }}
