name: Cornwall Slot Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore previous availability state
        uses: actions/cache/restore@v4
        with:
          path: .monitor-state
          key: cornwall-state-${{ github.run_id }}
          restore-keys: |
            cornwall-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Check Waitwhile availability
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          from playwright.sync_api import sync_playwright

          URL = "https://waitwhile.com/locations/cornwallsamplestore/time"
          WEBHOOK = os.environ["DISCORD_WEBHOOK_URL"]

          STATE_DIR = Path(".monitor-state")
          STATE_FILE = STATE_DIR / "state.json"
          STATE_DIR.mkdir(exist_ok=True)

          print("Opening Waitwhile...")

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)

              page = browser.new_page(
                  viewport={"width": 390, "height": 844}
              )

              page.goto(
                  URL,
                  wait_until="domcontentloaded",
                  timeout=60000
              )

              try:
                  page.wait_for_selector(
                      "text=Select date and time",
                      timeout=20000
                  )
              except Exception:
                  print("Booking section heading was not detected.")

              page.wait_for_timeout(5000)

              body_text = page.locator("body").inner_text()
              browser.close()

          if "Select date and time" in body_text:
              booking_text = body_text.split(
                  "Select date and time",
                  1
              )[1]
          else:
              booking_text = body_text

          # Turn line breaks and repeated spaces into normal spaces.
          clean_text = re.sub(r"\s+", " ", booking_text)

          # Only detect the compact date buttons:
          # Mon 28 Sep, Tue 29 Sep, Wed 30 Sep, etc.
          date_pattern = (
              r"\b(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s+"
              r"\d{1,2}\s+"
              r"(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b"
          )

          time_pattern = (
              r"\b(?:1[0-2]|[1-9]):[0-5][0-9]\s*"
              r"(?:AM|PM|am|pm)\b"
          )

          dates = sorted(
              set(re.findall(date_pattern, clean_text))
          )

          times = sorted(
              set(
                  x.upper()
                  for x in re.findall(time_pattern, clean_text)
              )
          )

          current = {
              "dates": dates,
              "times": times
          }

          print("Current dates:", dates)
          print("Current times:", times)

          # If the old state uses the previous formatting,
          # replace it with a clean baseline instead of alerting.
          reset_baseline = False

          if STATE_FILE.exists():
              try:
                  previous = json.loads(
                      STATE_FILE.read_text()
                  )

                  old_dates = previous.get("dates", [])

                  if any(
                      "\n" in date
                      or "," in date
                      for date in old_dates
                  ):
                      reset_baseline = True

              except Exception:
                  reset_baseline = True
          else:
              reset_baseline = True

          if reset_baseline:
              STATE_FILE.write_text(
                  json.dumps(current, indent=2)
              )

              print("Clean baseline saved.")
              print("No alert sent.")
              raise SystemExit(0)

          previous = json.loads(
              STATE_FILE.read_text()
          )

          previous_dates = set(
              previous.get("dates", [])
          )

          previous_times = set(
              previous.get("times", [])
          )

          current_dates = set(dates)
          current_times = set(times)

          new_dates = sorted(
              current_dates - previous_dates
          )

          new_times = sorted(
              current_times - previous_times
          )

          print("Previous dates:", sorted(previous_dates))
          print("Previous times:", sorted(previous_times))
          print("New dates:", new_dates)
          print("New times:", new_times)

          if new_dates or new_times:

              parts = [
                  "🚨 **CORNWALL SAMPLE STORE AVAILABILITY DETECTED**"
              ]

              if new_dates:
                  parts.append(
                      "📅 New date(s): "
                      + ", ".join(new_dates)
                  )

              if new_times:
                  parts.append(
                      "⏰ New time(s): "
                      + ", ".join(new_times)
                  )

              parts.append(
                  "\nBOOK NOW:\n" + URL
              )

              payload = json.dumps({
                  "content": "\n".join(parts)
              })

              result = subprocess.run(
                  [
                      "curl",
                      "--fail-with-body",
                      "--silent",
                      "--show-error",
                      "--retry", "2",
                      "--retry-delay", "2",
                      "-H", "Content-Type: application/json",
                      "-H", "User-Agent: Mozilla/5.0",
                      "-d", payload,
                      WEBHOOK
                  ],
                  capture_output=True,
                  text=True
              )

              if result.returncode != 0:
                  print("Discord notification failed.")
                  print(result.stderr)
                  raise SystemExit(1)

              print("✅ Discord notification sent.")

          else:
              print("No new availability detected.")

          STATE_FILE.write_text(
              json.dumps(current, indent=2)
          )

          print("Latest state saved.")
          PY

      - name: Save latest availability state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .monitor-state
          key: cornwall-state-${{ github.run_id }}
